<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Event Registration</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h2>📅 EVENT REGISTRATION FORM</h2>
    <form id="eventForm" class="card emphasized">
      <div class="form-group">
        <label for="name">Full Name *</label>
        <input type="text" id="name" required />
      </div>

      <div class="form-group">
        <label for="email">Email Address *</label>
        <input type="email" id="email" required />
      </div>

      <div class="form-group">
        <label for="event">Select Event *</label>
        <select id="event" required>
          <option value="" disabled selected>Select an event</option>
          <option value="Web Dev Bootcamp">Web Dev Bootcamp</option>
          <option value="AI Intro Session">AI Intro Session</option>
          <option value="UI/UX Masterclass">UI/UX Masterclass</option>
        </select>
      </div>

      <div class="form-group">
        <label for="startTime">Start Time</label>
        <input type="time" id="startTime" disabled />
      </div>
      
      <div class="form-group">
        <label for="endTime">End Time</label>
        <input type="time" id="endTime" disabled />
      </div>
      
      

      <div class="form-group">
        <label for="date">Preferred Date *</label>
        <input type="date" id="date" required disabled />
      </div>

      <button type="submit">Register</button>
      <div id="responseMessage" class="message"></div>
    </form>
  </div>

  <script src="main.js"></script>
</body>
</html>
